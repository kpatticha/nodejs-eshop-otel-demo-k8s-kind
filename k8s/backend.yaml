apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nodejs-eshop-otel-demo
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # OTel Operator injects the EDOT Node.js auto-instrumentation
        instrumentation.opentelemetry.io/inject-nodejs: "opentelemetry-operator-system/elastic-instrumentation"
    spec:
      containers:
        - name: backend
          image: nodejs-eshop-otel-demo-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: OTEL_SERVICE_NAME
              value: backend
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: nodejs-eshop-otel-demo
spec:
  selector:
    app: backend
  ports:
    - port: 8081
      targetPort: 8081
